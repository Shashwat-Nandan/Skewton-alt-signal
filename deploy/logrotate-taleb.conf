# Logrotate config for the taleb-karpathy runner logs (audit 3.5).
#
# The runners write one per-day file each (paper-YYYY-MM-DD.log,
# paper-pairs-*.log, autoresearch-*.log, signals-*.jsonl is handled
# separately). They are never appended to after their day, so they only
# need compressing and age-pruning — left alone, logs/ grows one file per
# runner per trading day forever.
#
# Install (host-localize the path first):
#   sudo cp deploy/logrotate-taleb.conf /etc/logrotate.d/taleb-karpathy
#   sudo logrotate -d /etc/logrotate.d/taleb-karpathy   # dry-run / verify
# One-time cleanup of any pre-existing backlog:
#   find <logs>/ -name '*.log.[0-9]*' -mtime +90 -delete
#
# --- EDIT THE PATH FOR YOUR VPS (the deployed tree, e.g. /root/algo-trading/...) ---
/opt/taleb-karpathy-kite/logs/*.log {
    daily
    missingok
    notifempty
    nocreate          # the runners create their own dated file each day
    compress
    delaycompress     # keep the most-recent rotation uncompressed for tailing
    maxage 90         # delete rotated logs older than 90 days
    rotate 400        # high cap; maxage is the real pruner
    su root root
}
