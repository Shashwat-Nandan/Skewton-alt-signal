# Tracked copy of the baseline paper runner's ExecStart override drop-in.
#
# This is the git-tracked source of truth for the host-local drop-in installed
# at /etc/systemd/system/pair-paper.service.d/10-top8.conf (paths adapted per
# host, as with every unit in deploy/ — templates use /opt).
#
# Overrides (2026-07-18):
#   1. top-12 -> top-8 cointegrated universe.
#   2. --max-daily-loss-inr 100000000 -> 100000 (a real ₹1L breaker).
#
# WHY top-8: tighter universe as the paper-validation config ahead of a future
# live-alongside cutover. Stays PAPER (no --mode live) until top-8 clears its own
# paper window (safety rule 3). See tasks/todo.md (2026-07-18 baseline top-8).
#
# WHY the ₹1L cap is safe: run_paper_pairs.halt_daily_loss_path namespaces the
# daily-loss flag per --system. --system baseline (this unit) touches
# data_cache/HALT_DAILY_LOSS_baseline, which the LIVE persistent runner
# (canonical data_cache/HALT_DAILY_LOSS) does NOT read — so a paper breach can
# no longer halt the live book. Operator HALT_ALL / HALT_NEW_ENTRIES stay shared.
#
# Belt-and-suspenders: the base unit template (deploy/pair-paper.service) already
# carries these same values, mirroring how override.conf is kept alongside the
# base ProtectHome setting. This drop-in is a no-op where the installed base unit
# is already on the top-8 template, and load-bearing where an installed base unit
# predates it (as on the current host, whose base unit still reads --top 12).
#
# ExecStart is reset (empty line) before being redefined — required to override
# the base unit's ExecStart from a drop-in.
[Service]
ExecStart=
ExecStart=/opt/taleb-karpathy-kite/.venv/bin/python -m runners.run_paper_pairs --top 8 --max-leg-notional 1000000 --max-daily-loss-inr 100000
