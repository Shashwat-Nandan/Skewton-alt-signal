# BANKNIFTY Taleb — SELF-CONTAINED cold config (issue #62).
# ===================================================================
# Run the isolated 2nd instance with:  run_paper.py --config config_banknifty.ini
#
# WHY self-contained (not a thin override merged onto config.ini): config.ini is
# the NIFTY *autoresearch seed* — it accumulates NIFTY-tuned values (some not
# even in this template), so any key a thin override didn't reset would inherit
# NIFTY's fit and the "cold seed" would be a lie. This file instead carries the
# BOOK-DEFAULT [strategy] verbatim from config_template.ini (drift-guarded by
# tests/test_run_paper.py::test_banknifty_template_strategy_is_book_default) plus
# `underlying = BANKNIFTY` and `use_best_params = false` → a GENUINELY cold seed.
#
# CREDENTIALS come from the KITE_* env vars (.env, loaded by run_paper + the
# systemd EnvironmentFile), which take precedence over the [kite] placeholders
# below — so this committed file holds NO secrets. Copy to config_banknifty.ini
# (gitignored) on the host; the placeholders stay as-is if you use .env.
#
# ISOLATION: the runner keys state/lock/log off `underlying`
# (data_cache/taleb_paper_state_BANKNIFTY.json, .taleb_paper_BANKNIFTY.lock,
# logs/paper_BANKNIFTY-*.log; IV history → iv_history_BANKNIFTY.json). Lot size /
# futures contract / strike step (100) / spot ("NSE:NIFTY BANK") resolve from the
# underlying automatically. PAPER-ONLY — no live path for this variant yet.
#
# DATA DEPENDENCY: spot history seeds from data_cache/BANKNIFTY_*_eod.csv
# (fetch_index_daily.py); without it the RV/IV gate is permissive each morning
# until ~10 min of intraday ticks accumulate.
#
# NOTE (unvalidated): total_capital is 1M (same as NIFTY). BANKNIFTY's per-lot
# margin is materially larger; this capital was NOT sized for the instrument.
# Watch for entries sizing toward 0 lots in paper before trusting the sizing.
[kite]
api_key = YOUR_KITE_API_KEY
api_secret = YOUR_KITE_API_SECRET
user_id = YOUR_ZERODHA_USER_ID
password = YOUR_ZERODHA_PASSWORD
totp_key = YOUR_TOTP_SECRET_KEY
redirect_url = http://127.0.0.1/

[strategy]
# Underlying to trade: NIFTY or BANKNIFTY
underlying = BANKNIFTY
exchange = NFO
# Cold start — do NOT inherit NIFTY's tuned best_params.json.
use_best_params = false

# Capital allocation
total_capital = 1000000
position_size_pct = 15
max_positions = 6
# Daily-loss circuit breaker as a % of total_capital. 1.5% of ₹10L = ₹15k.
max_daily_loss_pct = 1.5

# Hedging parameters (BOOK DEFAULTS, mirror config_template.ini — kept in sync by
# test_banknifty_template_strategy_is_book_default so a template change can't drift)
rehedge_delta_threshold = 0.15
gamma_scalp_band_pct = 1.5
vega_limit = 500
max_holding_period_hours = 48
entry_iv_percentile_min = 30
entry_iv_percentile_max = 70
skew_pct_max = 80
# NOTE 2026-07-06: the MC mean this floors is now NET of modeled costs and
# simulated at live RV (see config_template.ini) — 0.0 is a materially
# stricter gate than the same 0.0 was when this instance was seeded. The
# running BANKNIFTY paper instance inherits that stricter gate implicitly;
# whether to loosen it is an operator decision.
mc_min_mean_pnl = 0.0
# Issue #160: MC entry-gate path source — gbm (iid Gaussian, default) or
# bootstrap (block-bootstrap of real daily returns). IMMUTABLE; paper-first.
mc_path_source = gbm
enable_regime_dispatch = false
max_layered_structures = 1
t0_band_factor = 1.0
regime_straddle_iv_pct_max = 60.0
regime_straddle_rv_iv_ratio_min = 1.0
regime_straddle_skew_pct_max = 70.0
regime_calendar_iv_pct_min = 70.0
regime_calendar_skew_pct_max = 60.0
regime_risk_reversal_skew_pct_min = 80.0
regime_backspread_vvol_min = 0.15
regime_asymmetric_strangle_rv_iv_min = 1.30
regime_asymmetric_strangle_skew_pct_min = 70.0

# Safety rails (autoresearch loop CANNOT change these)
max_position_margin_pct = 30
no_naked_shorts = true
liquidity_min_spread_pct = 1.0
no_trade_last_minutes = 15
gap_exit_threshold_pct = 3.0
circuit_breaker_consecutive_losses = 3
circuit_breaker_pause_minutes = 60

[logging]
level = INFO
log_dir = ./logs
trade_log = trades.csv
greeks_log = greeks.csv

[mode]
# paper or live
trading_mode = paper
