name: lockfile

# Catches two regressions:
#   1. requirements.in / requirements-dev.in edited without regenerating
#      the corresponding .lock (resolution drift).
#   2. The pinned closure no longer installs cleanly with --require-hashes
#      (e.g. a yanked release leaves the lock unbuildable).

on:
  pull_request:
    paths:
      - "requirements.in"
      - "requirements-dev.in"
      - "requirements.lock"
      - "requirements-dev.lock"
      - ".github/workflows/lockfile.yml"
  push:
    branches: [main]
    paths:
      - "requirements.in"
      - "requirements-dev.in"
      - "requirements.lock"
      - "requirements-dev.lock"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Regenerate lockfiles and assert no drift
        run: |
          uv pip compile requirements.in \
            --generate-hashes --output-file requirements.lock \
            --python-version 3.11 --quiet
          uv pip compile requirements-dev.in \
            --generate-hashes --output-file requirements-dev.lock \
            --python-version 3.11 --constraint requirements.lock --quiet
          git diff --exit-code -- requirements.lock requirements-dev.lock

      - name: Install with --require-hashes in a clean venv
        run: |
          uv venv --python 3.11 .verify
          .verify/bin/python -m ensurepip --upgrade
          .verify/bin/python -m pip install --require-hashes \
            -r requirements.lock -r requirements-dev.lock
