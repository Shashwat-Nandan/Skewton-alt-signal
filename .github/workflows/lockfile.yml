name: lockfile

# Thin caller -> org hub reusable. Asserts requirements*.lock stay in sync with the
# requirements*.in sources and remain installable with --require-hashes.
on:
  pull_request:
    paths:
      - "requirements.in"
      - "requirements-dev.in"
      - "requirements.lock"
      - "requirements-dev.lock"
      - ".github/workflows/lockfile.yml"
  push:
    branches: [main]
    paths:
      - "requirements.in"
      - "requirements-dev.in"
      - "requirements.lock"
      - "requirements-dev.lock"

jobs:
  lockfile:
    uses: Skewton/.github/.github/workflows/lockfile.yml@main
    with:
      source-type: requirements-in
