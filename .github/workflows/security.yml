name: security

# Free-plan-friendly security gate (no GitHub Advanced Security required).
#   - gitleaks      : secret scanning across full history          [BLOCKING]
#   - pip-audit     : Python dependency CVEs (requirements.lock)   [advisory*]
#   - npm-audit     : frontend dependency CVEs                     [advisory*]
#   - bandit        : Python SAST                                  [advisory*]
#   - signatures    : every PR commit must be verified-signed      [advisory*]
# *advisory = reports loudly but does not fail the build yet. Promote each to
#  blocking (remove continue-on-error) once its baseline is triaged / all devs
#  have registered signing keys. See AGENTS.md + SECURITY.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so the scan covers past commits
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan
        run: gitleaks detect --source . --redact --verbose

  pip-audit:
    name: Python deps CVE audit (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true       # advisory until baseline triaged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pip-audit against the locked closure
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement requirements.lock --requirement requirements-dev.lock --strict

  npm-audit:
    name: Frontend deps CVE audit (npm audit)
    runs-on: ubuntu-latest
    continue-on-error: true       # advisory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit production deps
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

  bandit:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    continue-on-error: true       # advisory until baseline triaged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run bandit (medium+ severity/confidence)
        run: |
          python -m pip install --upgrade pip bandit
          bandit -r . -ll -ii \
            --exclude ./tests,./frontend,./.venv,./data_cache,./state

  signatures:
    name: Commit signatures verified
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true       # advisory until every founder registers a signing key
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check every PR commit is verified-signed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          unsigned=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | select(.commit.verification.verified == false) | "\(.sha[0:9])  \(.commit.message | split("\n")[0])"')
          if [ -n "$unsigned" ]; then
            echo "::warning::Unsigned / unverified commits found:"
            echo "$unsigned"
            echo "Set up commit signing (see CONTRIBUTING.md). This becomes BLOCKING once all founders have registered signing keys."
            exit 1
          fi
          echo "All PR commits are verified-signed. ✓"
