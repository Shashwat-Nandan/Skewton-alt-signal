name: security

# Free-plan-friendly security gate (no GitHub Advanced Security required).
#   - gitleaks   : secret scanning across full history        [BLOCKING — red fails]
#   - pip-audit  : Python dependency CVEs                      [advisory — green + ⚠️ warning]
#   - npm-audit  : frontend dependency CVEs                    [advisory — green + ⚠️ warning]
#   - bandit     : Python SAST                                 [advisory — green + ⚠️ warning]
#   - signatures : every PR commit verified-signed            [advisory — green + ⚠️ warning]
# Advisory jobs surface findings as GitHub warning annotations WITHOUT failing the
# check — a green PR that still tells you what to triage. Promote any of them to
# blocking by removing the `|| { warn ... }` wrapper once its baseline is clean.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan
        run: gitleaks detect --source . --redact --verbose

  pip-audit:
    name: Python deps CVE audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Audit (advisory)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement requirements.lock --requirement requirements-dev.lock --strict || {
            echo "::warning title=pip-audit::Dependency CVE(s) found (advisory) — triage; not blocking."
            echo "### ⚠️ pip-audit: dependency CVEs found (advisory)" >> "$GITHUB_STEP_SUMMARY"
          }

  npm-audit:
    name: Frontend deps CVE audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit (advisory)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high || {
            echo "::warning title=npm-audit::Frontend CVE(s) found (advisory) — triage; not blocking."
            echo "### ⚠️ npm audit: frontend CVEs found (advisory)" >> "$GITHUB_STEP_SUMMARY"
          }

  bandit:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Bandit (advisory)
        run: |
          python -m pip install --upgrade pip bandit
          bandit -r . -ll -ii --exclude ./tests,./frontend,./.venv,./data_cache,./state || {
            echo "::warning title=bandit::SAST findings (advisory) — review; not blocking."
            echo "### ⚠️ bandit: SAST findings (advisory)" >> "$GITHUB_STEP_SUMMARY"
          }

  signatures:
    name: Commit signatures verified
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check every PR commit is verified-signed (advisory)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          unsigned=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | select(.commit.verification.verified == false) | "\(.sha[0:9])  \(.commit.message | split("\n")[0])"')
          if [ -n "$unsigned" ]; then
            echo "::warning title=signatures::Unsigned/unverified commits (advisory) — set up signing (CONTRIBUTING.md); not blocking."
            echo "$unsigned"
            echo "### ⚠️ Unsigned commits (advisory)" >> "$GITHUB_STEP_SUMMARY"
            echo "$unsigned" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All PR commits are verified-signed. ✓"
          fi
