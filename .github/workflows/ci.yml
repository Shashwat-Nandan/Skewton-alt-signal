name: ci

# Thin caller -> org hub reusables. Backend = ruff + pytest on the hash-pinned uv
# lockfile flow (provisions config.ini from the secret-free template, lists skips,
# and fails if more than the 8 known data_cache skips appear). Frontend = tsc+vite
# build (lint/test run automatically once those npm scripts exist). Behaviour lives
# in Skewton/.github.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    uses: Skewton/.github/.github/workflows/python-ci.yml@main
    with:
      pre-test-cmd: "cp config_template.ini config.ini"
      pytest-args: "-rs"
      max-skips: "8"
  frontend:
    uses: Skewton/.github/.github/workflows/ci-frontend.yml@main
    with:
      working-directory: frontend
