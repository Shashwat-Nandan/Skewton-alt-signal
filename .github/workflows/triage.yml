name: triage

# Thin caller -> org hub reusable. PR/issue triage (assign author, needs-assignee nudge).
on:
  pull_request:
    types: [opened]
  issues:
    types: [opened, assigned]

permissions:
  issues: write
  pull-requests: write

jobs:
  triage:
    uses: Skewton/.github/.github/workflows/triage.yml@main
