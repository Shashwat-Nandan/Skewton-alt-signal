[kite]
api_key = YOUR_KITE_API_KEY
api_secret = YOUR_KITE_API_SECRET
user_id = YOUR_ZERODHA_USER_ID
password = YOUR_ZERODHA_PASSWORD
totp_key = YOUR_TOTP_SECRET_KEY
redirect_url = http://127.0.0.1/

[broker]
# Which broker owns login + live orders. Market-data CLIs (fetch_*, tick
# capture) stay on Kite regardless. Default zerodha = existing hosts unchanged.
# zerodha | kotak | groww | dhan
# Groww and Dhan are registered in the factory but refuse to login/order
# until their adapters are live-wired (paper → live gate).
name = zerodha

[kotak]
# Kotak Securities Neo Trade API (NEO app → More → Trade API → Generate app).
# Used when broker.name = kotak. Env vars KOTAK_* override these.
consumer_key = YOUR_KOTAK_CONSUMER_KEY
mobile_number = YOUR_KOTAK_MOBILE
ucc = YOUR_KOTAK_UCC
mpin = YOUR_KOTAK_MPIN
totp_key = YOUR_KOTAK_TOTP_SECRET
neo_fin_key = neotradeapi
# Only prod is wired. Any other value (uat, sandbox) fails at adapter
# construct — UAT uses different login hosts/paths and must not silently
# hit production.
environment = prod

[groww]
# Groww Trade API. Adapter is registered but not live-wired.
api_key = YOUR_GROWW_API_KEY
api_secret = YOUR_GROWW_API_SECRET
totp_key = YOUR_GROWW_TOTP_SECRET

[dhan]
# DhanHQ v2. Adapter is registered but not live-wired.
# Either access_token *or* pin + totp_key.
client_id = YOUR_DHAN_CLIENT_ID
access_token = YOUR_DHAN_ACCESS_TOKEN
pin = YOUR_DHAN_PIN
totp_key = YOUR_DHAN_TOTP_SECRET

[strategy]
# Underlying to trade: NIFTY or BANKNIFTY
underlying = NIFTY
exchange = NFO

# Capital allocation
total_capital = 1000000
position_size_pct = 15
max_positions = 6
# Daily-loss circuit breaker as a % of total_capital. 1.5% of ₹10L = ₹15k.
max_daily_loss_pct = 1.5

# Hedging parameters (autoresearch loop tunes these)
# Issue #237 Path A: band in lots. 1.0 is a deliberately WIDE first-order
# scalp band (Taleb: don't rehedge every tick) — a ~6.7x widening of the
# previous 0.15, chosen for Path A, not forced by the hedger.
# NB (#238 review): an earlier note here claimed the threshold "must stay
# ≥ 0.6 or futures round to 0". That is not true and contradicted the code:
# check_and_rehedge already floors the drift at min_hedgeable_lots = 0.25
# and deliberately lets the 0.25-0.5 band through so the SOFT path (an ATM
# option, ~0.5 delta per lot) can hedge it. See the comment block above
# `soft_lot_delta` in strategies/taleb_karpathy.py before retuning this.
rehedge_delta_threshold = 1.0
gamma_scalp_band_pct = 1.5
# Per-LOT vega cap: the gate is |net_vega| <= vega_limit x n_long_lots, so it
# is scale-INVARIANT — shrinking the structure cannot satisfy it. 500 is an
# off switch, not a cap: a NIFTY ATM straddle's per-lot vega clears it at ANY
# size, so a book seeded from this template takes ZERO trades (verified:
# 40-day synthetic backtest, 0 trades at 500 vs 14 at 4000).
# Until #237 that was masked — the unpromoted best_params.json overlay was
# quietly supplying 4000. Refusing that overlay made the template value
# binding for the first time, so the book default has to be the real one
# (#238 review). Host configs narrow it per instrument: config.ini 4000
# (NIFTY), config_banknifty.ini 3700 (per-lot vega ~ spot x lot_size x sqrt(T)).
# This is a units fix, not a validated risk budget.
vega_limit = 4000
# Issue #237: 22h/48h time-stops killed both the weekly straddle and the
# (mis-fired) backspread before a jump could pay. 168h = one calendar week;
# the expiry-day flatten in run_paper is the real stop.
max_holding_period_hours = 168
entry_iv_percentile_min = 30
entry_iv_percentile_max = 70
# Put-skew percentile gate (Phase 1.3). Reject ATM-straddle entry when
# skew = IV(25Δ put) − IV(25Δ call) sits above this percentile of its
# rolling history. 100 disables the gate; 70 is aggressive.
skew_pct_max = 80
# Gap #2 MC expected-value entry gate. Reject entries whose Monte Carlo
# MEAN path P/L (₹) is below this floor. Gates on EXPECTANCY, not win-rate.
# 0.0 refuses any negative-EV entry; set negative (e.g. -10000) to allow
# modest-cost tail hedges. Not in autoresearch TUNABLE_RANGES, so this
# seed value is what each sweep carries through to best_params.json.
# SINCE 2026-07-06 the simulated mean is NET of modeled transaction costs
# (entry/exit legs + rehedges) and runs at live realized vol, so it reads
# systematically LOWER than the old gross fixed-vol number — 0.0 now means
# "positive net-of-cost expectancy", a materially stricter gate than the
# same 0.0 was before. Recalibrate deliberately, don't compare across eras.
mc_min_mean_pnl = 0.0
# Issue #160: how the MC entry-gate paths are generated.
#   gbm       — iid Gaussian returns at the calibrated daily vol (default).
#   bootstrap — circular block-bootstrap of real daily returns (fat tails +
#               vol clustering preserved), demeaned and rescaled to the same
#               daily vol; falls back to gbm (loudly) if <20 daily returns.
# IMMUTABLE (the autoresearch sweep never flips it). Roll out paper-first.
mc_path_source = gbm
# Phase 3.1: enable regime → structure dispatch. true routes to one of
# {straddle, calendar, risk reversal, backspread, asymmetric strangle}.
# false (legacy / issue #237 Path A) emits straddles only. Do not turn
# this on via best_params.json unless validation.promote_ok is True AND
# validation.promoted_by is a non-empty operator signature — promote_ok
# alone is a machine checklist that can pass untested (#238).
enable_regime_dispatch = false
# Phase 4: max parallel structures the book can hold. 1 keeps legacy
# behaviour; 2-3 enables layered books under regime dispatch.
max_layered_structures = 1
# Phase 5: T-0 band tightening factor. 1.0 disables. 0.33 = aggressive.
t0_band_factor = 1.0
# Phase 3.1 regime-classifier routing cutoffs (used when enable_regime_dispatch
# = true). Tunable by the autoresearch loop. Defaults mirror
# regime_classifier.Thresholds. Percentiles are 0-100; ratios unitless; vvol is
# fractional (std/mean of recent ATM IV).
regime_straddle_iv_pct_max = 60.0
regime_straddle_rv_iv_ratio_min = 1.0
regime_straddle_skew_pct_max = 70.0
regime_calendar_iv_pct_min = 70.0
regime_calendar_skew_pct_max = 60.0
regime_risk_reversal_skew_pct_min = 80.0
regime_backspread_vvol_min = 0.15
regime_asymmetric_strangle_rv_iv_min = 1.30
regime_asymmetric_strangle_skew_pct_min = 70.0

# Safety rails (autoresearch loop CANNOT change these)
max_position_margin_pct = 30
no_naked_shorts = true
liquidity_min_spread_pct = 1.0
no_trade_last_minutes = 15
gap_exit_threshold_pct = 3.0
circuit_breaker_consecutive_losses = 3
circuit_breaker_pause_minutes = 60

[autoresearch]
# Karpathy loop settings
enabled = true
eval_cycles_per_experiment = 5
# Objective. net_pnl = realized + unrealized P&L (₹), net of costs — the
# metric that actually tracks money. gamma_theta_ratio was tried (Phase 2.4)
# but is DECOUPLED from P&L: the 2026-06-13 run maximized it to 0.95 while
# the "winner" lost more than baseline in-sample (a high ratio with negative
# P&L). Sharpe degenerates on single-session tape. Stick to net_pnl.
# Other options (use with care): gamma_theta_ratio, sharpe_ratio, calmar_ratio.
metric = net_pnl
variance_penalty = 0.5
max_drawdown_threshold = 5.0
results_file = results.tsv
log_file = autoresearch.log
mutation_step_size = 0.1
# Fraction of current value to mutate by (10%)
# Phase 2.5: probability of mutating two correlated params jointly.
joint_mutation_prob = 0.20
# 2026-05-31: backtests prime the IV/skew rolling windows from the persisted
# iv_history_<underlying>.json so the IV-percentile / regime tunables leave
# warmup (a tape replay fires one entry scan per session, otherwise pinned at
# the neutral 50.0). iv_seed_drop_recent trims the most-recent K observations
# from that seed — a coarse guard against ranking a session against its own /
# a future session's IV (the JSON carries no per-observation timestamps).
# 0 = use the full persisted history.
iv_seed_drop_recent = 0
# Issue #159: when the seed's own fitness is VETOED (−999999 — bleed cap,
# squandered edge, DD blow-up), "keep iff > baseline" degenerates: any
# non-vetoed mutation "beats" the seed. A vetoed baseline is treated as NO
# baseline and mutations are accepted only above this absolute floor.
# 0.0 = require strictly positive fitness (rupee-scale for the P&L metrics).
# Must be >= 0: a negative floor would mean "accept losing configs", which
# contradicts the bar's purpose — the loop refuses to start on a negative.
vetoed_baseline_abs_floor = 0.0

[decay]
# Strategy decay state machine (scripts/strategy_decay.py) — OPT-IN critical
# monthly-loss caps, positive rupees per scoreboard slug. A single complete
# month losing more than the cap fast-paths that strategy straight to
# PARK RECOMMENDED (skipping MONITORING). Unset = fast path disabled; the
# consecutive-months rule always applies regardless. Slugs: see
# strategy_scoreboard.build_rows (pair_persistent_live, pair_baseline,
# kalman_pairs, taleb_nifty, arbitrage, buy_on_gap, equity_swing,
# kalman_trend). Examples:
# critical_monthly_loss_taleb_nifty = 30000
# critical_monthly_loss_pair_persistent_live = 50000

[logging]
level = INFO
log_dir = ./logs
trade_log = trades.csv
greeks_log = greeks.csv

[mode]
# paper or live
trading_mode = paper
# If paper, orders are simulated but data is real

[delivery_accum]
# Delivery-percentage accumulation strategy (runners/run_delivery_accum.py).
# Defaults live in strategies/delivery_accumulation.py:DeliveryAccumulationStrategy.DEFAULTS
# and are overridden by any values present here. All keys are optional.
# total_capital        = 1000000
# risk_per_trade_pct   = 1.0
# max_positions        = 6
# max_gross_exposure_pct = 30.0
# deliv_entry_pctile   = 0.92
# deliv_min_hits       = 2
# range_pos_max        = 0.30
# min_avg_turnover_cr  = 25.0
# atr_stop_multiplier  = 3.0
# risk_reward          = 2.5
# time_stop_days       = 40

[equity_swing]
# Varsity-style medium-term equity swing (runners/run_equity_swing.py).
# Defaults live in strategies/varsity_equity_swing.py:VarsityEquitySwingStrategy.DEFAULTS
# and are overridden by any values present here. All keys are optional —
# missing keys fall back to the in-code defaults.

# --- Risk sizing (Module 9) ---
total_capital         = 1000000
risk_per_trade_pct    = 1.0
max_positions         = 6
max_gross_exposure_pct = 30.0

# --- Trend gate (Module 2) ---
trend_short_window    = 50
trend_long_window     = 200
adx_window            = 14
adx_threshold         = 20.0

# --- ATR exits + Chandelier trail (Module 9) ---
atr_window            = 14
atr_stop_multiplier   = 2.5
chandelier_multiplier = 3.0
chandelier_lookback   = 22
# Exit geometry re-based 2026-07-06 (efficiency review §2.5): rr=100 makes
# the fixed target unreachable, so exits are SL / Chandelier trail (from 1R)
# / time-stop — the only geometry net-positive on BOTH halves of the
# 2024-06→2026-07 sweep (train +79.0k / test +41.6k vs −46.0k test for the
# old rr=2.0). The paper book's forward record agreed: 0/12 targets ever hit.
risk_reward           = 100
time_stop_days        = 20

# --- Entry triggers ---
gap_filter_pct        = 2.0
pullback_atr_multiple = 0.5
ema_pullback_window   = 20
breakout_window       = 20
volume_surge_multiple = 1.5
min_avg_turnover_cr   = 50.0
trail_activate_R      = 1.0

# --- Market Profile gate (Phase 2). Default OFF until split-adjusted
# EQ bhavcopy archive is populated; flip to 1 once equity_ohlcv/ has data.
mp_enabled            = 0
mp_lookback           = 20
mp_value_area_pct     = 70.0
mp_tick_pct           = 0.20
mp_veto_below_val     = 1
mp_boost_above_vah    = 1

# --- OI confluence gate (Phase 2). Default OFF — 535-day EQ bhavcopy
# backtest (2024-03 → 2026-05, 209 symbols) showed the gate strips ~₹52K
# of edge per ₹10L over the window (Sharpe 0.48 → 0.18). The earlier
# default-ON decision was based on a 125-day STF-proxy run with
# corp-action artifacts. Flip to 1 if your universe / regime differs.
oi_enabled            = 0
oi_lookback           = 5
oi_min_price_chg_pct  = 1.0
oi_min_oi_chg_pct     = 2.0
oi_veto_short_buildup = 1
oi_boost_long_buildup = 1

# --- FII/DII overlay (Phase 3). Reads data_cache/fii_dii/*.json.
fii_enabled              = 1
fii_lookback             = 5
fii_boost_when_positive  = 1

[arbitrage]
# Calendar / term-structure spreads on single-stock futures
# (runners/run_paper_arbitrage.py). Defaults live in
# strategies/arbitrage.py:ArbitrageStrategy.__init__; missing keys fall back to
# those in-code defaults. The cash-futures basis arm is signals-only (retail
# F&O can't execute the cash leg) — only calendar spreads are traded.

# Universe: comma-separated underlyings. Leave blank to use NIFTY 50.
universe =

# Cost-of-carry assumptions (annualized fractions). dividend_yield_default is
# the global fallback q. Use the per-symbol dividend_yields overlay to set
# realistic yields on high-yield names (ITC / COALINDIA / HUL / ONGC ex-dates
# otherwise show as "cash-rich" basis and trigger spurious LONG_CALENDAR
# entries; calendar_max_leg_basis is the downstream band-aid).
risk_free_rate = 0.07
dividend_yield_default = 0.0
# Comma-separated SYMBOL=q pairs, e.g. ITC=0.04,COALINDIA=0.06,HINDUNILVR=0.025
dividend_yields =

# Cash-futures basis — signals-only. Annualized basis threshold.
basis_entry_annual = 0.015
basis_min_dte = 3

# Calendar / term-structure spread — tradable. Implied carry diff vs r-q.
# Must clear the round-trip cost (dominated by STT 0.05% on the two sell legs);
# at 0.02-0.025 the carry capture < cost and the book bleeds on expiry-week
# convergence churn (2026-06-19 incident, ~₹20k). 0.05 leaves margin above the
# ~0.19%-of-notional round-trip hurdle. See config.ini comment for the math.
calendar_entry_annual = 0.05
calendar_exit_annual = 0.005
calendar_max_holding_days = 15
calendar_min_dte_near = 4

# Rupee cost hurdle at entry (efficiency review 2026-07-05 §2.3/E2). The %
# gate above can pass a spread whose HARVESTABLE carry is still tiny in
# rupees (June 2026 forward record: ₹658 net earned on ₹93,963 of costs).
# Expected harvest must clear this multiple of the modeled 4-leg round-trip
# cost. The harvest formula is deliberately conservative — see the comment in
# strategies/arbitrage.py:_build_calendar_entry for what 2.0x really means.
# 0 disables the FEE hurdle only — calendar_crossing_mult below is applied
# independently and is NOT switched off with it.
calendar_cost_hurdle_mult = 2.0
# Multiple of the MEASURED round-trip crossing cost (the half-spread quoted on
# both legs, in and out) to charge in the same hurdle. The full gate is
#   expected_carry >= calendar_cost_hurdle_mult x fees
#                     + calendar_crossing_mult  x crossing
# so 1.0 means "cover crossing once", NOT "cover it cost_hurdle_mult times".
#
# DEFAULT 0.0 = measure and log only; entry behaviour is unchanged. Crossing is
# the larger cost (measured 2026-09-07: ~0.235% of leg notional against an
# expected harvest of ~0.185% at the 5% gate), so a trade can be
# expected-negative the instant it fills and still clear a fee-only hurdle. At
# 0.0 the strategy logs which entries a crossing-charging hurdle would have
# rejected — that record is the evidence for choosing this value. Do not set it
# from a guess; see issues #233 and #222.
calendar_crossing_mult = 0.0
# CONVERGE-exit debounce in consecutive ticks (~minutes at the 60s tick;
# pair_trading's exit_debounce_ticks idiom). Filters single noisy carry_diff
# prints without pinning a genuinely-converged spread — the strategy has no
# stop-loss exit, so a time-based min-hold would carry open re-divergence
# risk. EXPIRY / MAX_HOLD exits are never debounced. 1 = off.
calendar_exit_debounce_ticks = 3

# Cleanliness gate. Skip the calendar if EITHER leg's standalone annualized
# cash-futures basis exceeds this (filters dividend-pinned names where the
# apparent carry mispricing is a discrete cash payout priced into one expiry).
calendar_max_leg_basis = 0.10

# Sizing
lots_per_leg = 1
max_open_calendars = 5
max_leg_notional = 1000000
# Calendar-spread margin estimate as a fraction of ONE leg's notional. A
# futures calendar is margined on inter-month basis risk, not two outright
# SPANs — real Zerodha basket margin ~4-7% of one leg. Informational proxy;
# gate live sizing on kite.basket_order_margins, not this.
calendar_margin_pct = 0.06

# Set true to run as a pure basis-monitoring service: log basis dislocations
# but never propose calendar entries. Recommended for retail F&O — a 6-month
# backtest showed calendar net P&L is structurally negative after costs.
disable_calendar = false

[buy_on_gap]
# Strategy #5 — intraday mean reversion, "Buy-on-Gap" (Ernie Chan §4.3),
# run by runners/run_paper_buy_on_gap.py. Defaults live in
# strategies/buy_on_gap.py:BuyOnGapStrategy.DEFAULTS and are overridden by any
# keys present here. All keys optional.
#
# BACKTEST CAVEAT (read before trusting this): on NIFTY-200 daily bars
# 2024-03 → 2026-06 the edge is NOT regime-stable. A train/test split shows a
# strong 2024–early-2025 result that DECAYS/REVERSES in the last 12 months
# (e.g. k=1.0/trend-off: train Sharpe 2.71 → test −0.83). The only OOS
# survivor is a deep-gap, trend-off variant (k≈2.0σ: test Sharpe ~0.46). These
# defaults are the BOOK-FAITHFUL model, NOT the train-winner — paper mode is
# here to forward-test, not to deploy a validated edge. See
# tasks/buy-on-gap-plan.md for the full sensitivity table.
#
# NOTE: the systemd unit (deploy/buy-on-gap-paper.service) overrides these with
# `--gap-std-mult 2.0 --no-trend-filter` so the DEPLOYED paper run forward-tests
# the OOS-survivor config. CLI flags win over these keys; change the service
# flags (or drop them) to use a different paper config.

total_capital          = 1000000
max_positions          = 5          # N most-oversold gappers bought per day
max_gross_exposure_pct = 100.0      # equal-weight across the N
gap_std_mult           = 1.0        # k: require gap_ret <= -k * 90d-return-σ
std_window             = 90         # bars for the return-σ
ma_window              = 200        # long-MA window
use_trend_filter       = 1          # 1 = require open > long-MA (book refinement)
max_gap_down_pct       = 20.0       # skip blowups (news/halt) gapping below this
stop_loss_pct          = 5.0        # wide catastrophic intraday stop (% below entry)
min_avg_turnover_cr    = 50.0       # ₹ crore, 20d median — liquidity gate
slippage_bps           = 5.0        # modelled slippage per side (bps); statutory
                                    # intraday charges come from core.costs

[kalman_pair_trading]
# KalmanPairStrategy — time-varying hedge ratio (Palomar Ch.15 §15.6), run by
# runners/run_paper_kalman_pairs.py. The runner builds its OWN derived config from CLI
# args ("CLI knobs win"), so for the live paper runner these come from the
# runner's argparse defaults; this section binds only on direct construction.
# Re-based on the book 2026-06-29; entry_z 1.0→1.5 on the 2026-07-04 5-min
# revalidation — see tasks/kalman-pairs-rebase-plan.md. Keep in sync with the
# runner/backtest argparse defaults (test_kalman_pairs_defaults_in_sync pins it).
entry_z          = 1.5    # enter at |z|=entry_z; 1.5 not book s₀=1 (5-min churn)
exit_z           = 0.0    # book exit-at-mean (entry-side zero-crossing)
stop_z           = 4.0    # adverse stop in z (tighter exits MR winners early — see plan)
lookback_days    = 126    # rolling z-score window; book is 6 months (§15.6.4)
max_holding_days = 7
lots_per_leg     = 1
max_leg_notional = 1000000  # required for paper/live (strategy refuses without it)
min_edge_multiplier = 1.5   # cost-hurdle: expected ₹ move ≥ this × round-trip cost
# Net-directional-exposure cap: |net notional| / gross notional at entry.
# A same-side structure (γ<0 puts both legs the same way) scores 1.00 — it is a
# leveraged directional basket, not a hedge, and the z-stop bounds spread
# divergence, not market drawdown. Opposed pairs measured 0.03–0.31 across 31
# real open positions (2026-08-29), so a value between those separates them.
# 1.0 = OFF (default). Net exposure is logged on every entry either way.
# NOTE the paper runner REPLACES this whole section from its argparse defaults,
# so for that path set --max-net-exposure-pct, not this file.
max_net_exposure_pct = 1.0
# Regime gate — the lever that separates the profitable mean-reverting regime from
# the adverse one. Enter only when the RAW cointegration residual (filter
# innovation) is stationary by ADF (p ≤ adf_gate_p) over the last adf_gate_window
# days. Gating the Kalman normalized spread is inert (stationary by construction).
# 0 disables. Backtest: cut adverse-regime bleed 39–81%, kept in-regime upside.
adf_gate_p       = 0.05
adf_gate_window  = 60

[short_call_earnings]
# Short-Call-Into-Earnings — PAPER ONLY, run by runners/run_paper_short_call.py.
# Defaults live in strategies/short_call_earnings.py:ShortCallEarningsStrategy.
# DEFAULTS and are overridden by any keys present here. All keys optional.
#
# READ THIS FIRST: this strategy has NO MEASURED EDGE. See
# docs/research/pre-earnings-iv-crush-2026-08-29.md — on 1,236 single-stock
# results events (2025-01 to 2026-08) the earnings event is FAIRLY PRICED
# (implied E|jump| 3.43 vs realised 3.38 pct of spot; breach rate 41.3 against
# a 42.4 fair-value benchmark). The headline result for THIS structure — short
# ATM call at IVP>=90, +Rs2,029/event, t=2.24 — is 100 pct DIRECTIONAL: the
# identical vol exposure harvested delta-neutrally returns -Rs116 on the same
# 417 events, and it fades out of sample (t=2.06 in 2025 to 1.29 in 2026). It
# is deployed on PAPER to be measured, not because it is believed. Live raises.
#
# The number this paper run exists to produce is gap_through_stop_count /
# gap_through_worst_R in the EOD sidecar: on daily bars roughly 5 pct of events
# GAP THROUGH the stop, realising -1.55R on average and -3.13R at worst. A
# naked short call's loss is unbounded; the stop is a level you discover at the
# next print, not a level you exit at.
#
# NOTE: values here must be bare numbers. Trailing "# ..." comments on a value
# line are tolerated by the strategy's parser but a bare percent sign in one
# breaks configparser interpolation — keep prose on its own comment line.

total_capital           = 1000000
# risk_per_trade_pct is 1R as a share of capital. 2.0 is the FLOOR at which
# this can trade at all: 1R per lot is a median Rs12,502 across the tested
# events, so at 1.0 only 26.9 pct of events clear a single lot and the runner
# would look live while taking almost nothing.
risk_per_trade_pct      = 2.0
# max_positions: 0 = UNLIMITED concurrent positions, the paper-trading default.
# A cap truncates the signal set (at 3, 208 of 417 tested events were dropped
# for lack of a slot), and paper posts no real margin. Uncapped, peak
# concurrency is about 22 positions needing roughly Rs3.0M of SPAN at a 15pct
# of notional proxy - so the rupee P&L is NOT a return on Rs1,000,000.
# Restore a cap before any live sizing conversation.
max_positions           = 0
# entry_ivp_min is the gate the research actually tested.
entry_ivp_min           = 90.0
# target/stop are fractions of the credit received; 0.60/0.60 is exactly 1R.
target_pct_of_credit    = 0.60
stop_pct_of_credit      = 0.60
# Construction FAILS if target/stop falls below min_rr — the operator asked for
# a minimum 1R and a sub-1R config must not start silently.
min_rr                  = 1.0
# Enter T-1, flat by T+1. This counts sessions the runner actually OBSERVED,
# so an outage would silently extend the hold - hence the two backstops below.
max_hold_sessions       = 2
# Wall-clock backstop. A nominally 2-session position survived 6 calendar days
# in a missed-tick trace before this existed.
max_hold_calendar_days  = 5
# NEVER carry a short single-stock call into expiry: Indian stock options are
# PHYSICALLY SETTLED, so an ITM short call at expiry is a delivery obligation,
# and NSE ramps margin through expiry week. Force-flatten at this DTE. The exit
# logic previously referenced the expiry date nowhere at all - the same defect
# the kalman-pairs runner shipped with (PR #69, 2026-06-30).
expiry_flatten_dte      = 2
# Below this credit the round trip is pure cost (break-even slippage is about
# 0.7 pct of premium per leg-side).
min_credit_rupees       = 2000.0
min_dte                 = 7
max_dte                 = 45
slippage_pct_of_premium = 1.0
# 0 = SKIP when a single lot exceeds 1R; this preserves the "minimum 1R" rule.
# Setting it to 1 removes the last capital constraint and takes every signal,
# but 15pct of those positions then risk MORE than 1R (up to 2.3R). On the
# tested events that change alone added Rs446,771 of the Rs538,862 total - that
# is leverage, not edge: mean realised R only moves from +0.008 to +0.050.
allow_min_one_lot       = 0

